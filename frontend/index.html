<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIT</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a stored light/dark choice before first paint (app/theme.ts keeps it in sync).
      try { var t = localStorage.getItem("orbit-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

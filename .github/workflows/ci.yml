name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests ../examples
      # Coverage threshold lives in pyproject.toml ([tool.coverage.report] fail_under); the run fails below it.
      - run: pytest -q --cov=app --cov-report=term
      - run: pytest -q ../examples/example-skill
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # Generated API types must match the committed OpenAPI snapshot (the backend test checks the snapshot itself).
      - run: npm run gen:types && git diff --exit-code src/types/generated.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

services:
  # Backend API service
  - type: web
    name: orbit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    startCommand: "sh -c 'alembic upgrade head && uvicorn app.main:app_factory --factory --host 0.0.0.0 --port $PORT'"
    healthCheckPath: /health
    envVars:
      - key: ORBIT_DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: ORBIT_JWT_SECRET
        generateValue: true
      - key: ORBIT_ALLOWED_ORIGINS
        value: https://orbit-frontend.onrender.com
      - key: ORBIT_DEMO_MODE
        value: "false"
      # Nebius (set when access is available)
      # - key: NEBIUS_API_KEY
      #   sync: false
      # - key: LLM_PROVIDER
      #   value: nebius

  # Frontend static site
  - type: web
    name: orbit-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /api/*
        destination: https://orbit-backend.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://orbit-backend.onrender.com

databases:
  - name: orbit-db
    plan: starter
    databaseName: orbit
    user: orbit

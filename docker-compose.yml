services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - orbit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orbit-postgres:
